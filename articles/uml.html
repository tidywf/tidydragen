<script id="quarto-html-after-body" type="application/javascript">
  window.document.addEventListener("DOMContentLoaded", function (event) {

          return filterRegex.test(href) || localhostRegex.test(href) || mailtoRegex.test(href);
      }

      window.quartoDecorateExternalLinks = function (root) {
     var links = (root || window.document).querySelectorAll('a[href]:not(.nav-link):not(.navbar-brand):not(.toc-action):not(.sidebar-link):not(.sidebar-item-toggle):not(.pagination-link):not(.no-external):not([aria-hidden]):not(.dropdown-item):not(.quarto-navigation-tool):not(.about-link)');
      for (var i=0; i<links.length; i++) {
        const link = links[i];
        if (!isInternal(link.href)) {
          // undo the damage that might have been done by quarto-nav.js in the case of
          // links that we want to consider external
          if (link.dataset.originalHref !== undefined) {
            link.href = link.dataset.originalHref;
          }
          if (!link.classList.contains('no-external-icon')) {
          }
        }
      }
      };
      window.quartoDecorateExternalLinks(window.document);
    // Esc closes the popup (WCAG 1.4.13) and focus leaving both trigger and
    // popup closes it (WCAG 2.4.11); tippy handles neither for interactive popups.
    const hideOnEscAndFocusOut = {
      name: 'hideOnEscAndFocusOut',
      defaultValue: true,
      fn(instance) {
        const dismiss = () => {
          // A show scheduled by the trigger delay would otherwise reopen it
          instance.clearDelayTimeouts();
          instance.hide();
        };
        const onKeyDown = (event) => {
          if (event.key !== 'Escape') {
            return;
          }
          // Keep Esc from also reaching page handlers (e.g. reveal.js overview),
          // except an open reveal.js slide menu, which Esc should close too.
          // The menu handles keys only when its keyboard option is on.
          const menuHandlesEsc = window.Reveal?.getPlugin?.('menu')?.isOpen() &&
            window.Reveal.getConfig().menu?.keyboard !== false;
          if (!menuHandlesEsc) {
            event.stopPropagation();
          }
          if (instance.popper.contains(window.document.activeElement)) {
            // Disabled while refocusing so the focus trigger does not reopen it
            instance.disable();
            instance.reference.focus();
            instance.enable();
          }
          dismiss();
        };
        const onFocusOut = (event) => {
          const target = event.relatedTarget;
          if (target && !instance.reference.contains(target) &&
              !instance.popper.contains(target)) {
            dismiss();
          }
        };
        // On the trigger too: a click trigger (code-annotations: select) has no
        // blur handling. Attached for the instance's lifetime so leaving the
        // trigger also cancels a show still pending on the trigger delay.
        instance.reference.addEventListener('focusout', onFocusOut);
        return {
          onShow() {
            window.document.addEventListener('keydown', onKeyDown, true);
            instance.popper.addEventListener('focusout', onFocusOut);
          },
          onHide() {
            window.document.removeEventListener('keydown', onKeyDown, true);
            instance.popper.removeEventListener('focusout', onFocusOut);
          },
          onDestroy() {

        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
