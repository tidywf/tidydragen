  # r-tidydragen conda package. Keep in sync with deploy/conda/recipe/recipe.yaml.
  - r-base
  - r-dplyr
  - r-fs
  - r-glue
  - r-jsonlite
  - r-nemo
  - r-purrr
  - r-r6
  - r-readr
  - r-rlang
  - r-tibble
  - r-tidyr
  - r-quarto
  - quarto
  - bump-my-version
