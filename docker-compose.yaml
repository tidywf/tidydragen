# docker-compose for tidydragen — tidy a DRAGEN output dir to a local dir.
#
# Quick start:
#   mkdir -p in out                 # put a DRAGEN sample dir under ./in
#   docker compose run --rm tidydragen
#
# Overridable via env (or a .env file next to this one):
#   IMAGE_TAG   image tag to pull       (default: pinned pkg version below,
#                                        kept in sync by bump2version)
#   IN_DIR      host input dir          (default: ./in,  mounted read-only)
#   OUT_DIR     host output dir         (default: ./out)
#   FORMAT      output format           (default: parquet; parquet|tsv|csv|rds)
#
# Pass extra CLI flags after the service name — the image's ENTRYPOINT is
# tidydragen.R, so args append to it, e.g. include/exclude:
# --include/--exclude take nemo tool_parser names (<tool>_<table>, e.g.
# dragenmap_metrics), not R6 class names:
#   docker compose run --rm tidydragen tidy -d /data/in -o /data/out \
#     -f parquet --include dragenmap_metrics
#
# Build locally instead of pulling (needs conda lockfiles in repo root — see
# Dockerfile): docker compose build

services:
  tidydragen:
    image: ghcr.io/tidywf/tidydragen:${IMAGE_TAG:-0.0.0.9004}
    build:
      context: .
    volumes:
      - ${IN_DIR:-./in}:/data/in:ro
      - ${OUT_DIR:-./out}:/data/out
    command:
      - tidy
      - -d
      - /data/in
      - -o
      - /data/out
      - -f
      - ${FORMAT:-parquet}
