      - raw: 'start'
        tidy: 'start'
        type: 'int'
        description: 'interval start'
        versions: ['latest']
      - raw: 'end'
        tidy: 'end'
        type: 'int'
        description: 'interval end'
        versions: ['latest']
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'gene symbol'
        versions: ['latest']
      - raw: 'mean_coverage'
        tidy: 'mean'
        type: 'float'
        description: 'mean coverage over the gene'
        versions: ['latest']
      - raw: 'min_coverage'
        tidy: 'min'
        type: 'float'
        description: 'minimum coverage over the gene'
        versions: ['latest']
      - raw: 'max_coverage'
        tidy: 'max'
