        versions: ['latest']
  exoncov:
    description: 'TSO500 per-exon coverage report.'
    pattern: "\\.exon_cov_report\\.tsv$"
    ftype: 'tsv'
    columns:
      - raw: 'chr'
        tidy: 'chrom'
        type: 'char'
        description: 'chromosome'
        versions: ['latest']
      - raw: 'start'
        tidy: 'start'
        type: 'int'
        description: 'interval start'
        versions: ['latest']
      - raw: 'end'
        tidy: 'end'
        type: 'int'
        description: 'interval end'
        versions: ['latest']
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'gene symbol'
        versions: ['latest']
      - raw: 'mean_coverage'
        tidy: 'cov_mean'
        type: 'float'
        description: 'mean coverage over the exon'
        versions: ['latest']
      - raw: 'median_coverage'
        tidy: 'cov_median'
        type: 'float'
        description: 'median coverage over the exon'
        versions: ['latest']
      - raw: 'min_coverage'
        tidy: 'cov_min'
        type: 'float'
        description: 'minimum coverage over the exon'
        versions: ['latest']
      - raw: 'max_coverage'
        tidy: 'cov_max'
        type: 'float'
        description: 'maximum coverage over the exon'
        versions: ['latest']
  genecov:
    description: 'TSO500 per-gene coverage report.'
    pattern: "\\.gene_cov_report\\.tsv$"
    ftype: 'tsv'
    columns:
      - raw: 'chr'
        tidy: 'chrom'
        type: 'char'
        description: 'chromosome'
        versions: ['latest']
      - raw: 'start'
        tidy: 'start'
        type: 'int'
        description: 'interval start'
        versions: ['latest']
      - raw: 'end'
        tidy: 'end'
        type: 'int'
        description: 'interval end'
        versions: ['latest']
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'gene symbol'
        versions: ['latest']
      - raw: 'mean_coverage'
        tidy: 'cov_mean'
        type: 'float'
        description: 'mean coverage over the gene'
        versions: ['latest']
      - raw: 'min_coverage'
        tidy: 'cov_min'
        type: 'float'
        description: 'minimum coverage over the gene'
        versions: ['latest']
      - raw: 'max_coverage'
        tidy: 'cov_max'
        type: 'float'
        description: 'maximum coverage over the gene'
        versions: ['latest']
