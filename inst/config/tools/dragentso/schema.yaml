        versions: ['latest']
      - raw: 'GermlineFilterDatabase'
        tidy: 'germline_filter_db'
        type: 'char'
        description: 'germline filter by database'
        versions: ['latest']
      - raw: 'GermlineFilterProxi'
        tidy: 'germline_filter_proxi'
        type: 'char'
        description: 'germline filter by proximity'
        versions: ['latest']
      - raw: 'Nonsynonymous'
        tidy: 'nonsynonymous'
        type: 'char'
        description: 'is nonsynonymous'
        versions: ['latest']
      - raw: 'withinValidTmbRegion'
        tidy: 'within_valid_tmb_region'
        type: 'char'
