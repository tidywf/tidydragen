        versions: ['latest']
      - raw: 'ProteinChange'
        tidy: 'protein_change'
        type: 'char'
        description: 'protein change (p.)'
        versions: ['latest']
      - raw: 'CDSChange'
        tidy: 'cds_change'
        type: 'char'
