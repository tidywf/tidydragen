  sarinfo:
    description: 'TSO500 SampleAnalysisResults sample information.'
    pattern: "_SampleAnalysisResults\\.json$"
    glob: ["*_SampleAnalysisResults.json"]
    ftype: 'json'
    columns:
      - raw: 'sampleId'
        tidy: 'sample_id'
        type: 'char'
        description: 'sample ID'
        versions: ['latest']
      - raw: 'analysisDate'
        tidy: 'analysis_date'
        type: 'char'
        description: 'analysis date (YYYY-MM-DD)'
        versions: ['latest']
      - raw: 'analysisTime'
        tidy: 'analysis_time'
        type: 'char'
        description: 'analysis time (HH:MM:SS)'
        versions: ['latest']
      - raw: 'analysisRunName'
        tidy: 'analysis_run_name'
        type: 'char'
        description: 'analysis run name'
        versions: ['latest']
      - raw: 'analysisName'
        tidy: 'analysis_name'
        type: 'char'
        description: 'analysis name'
        versions: ['latest']
  sarqc:
    description: 'TSO500 SampleAnalysisResults QC, expanded metrics, and TMB/MSI biomarkers (one wide row).'
    pattern: '__no_file_match__sarqc'
    ftype: 'csv'
    columns:
      - raw: 'contamination_score'
        tidy: 'contamination_score'
        type: 'float'
        description: 'DNA library contamination score'
        versions: ['latest']
      - raw: 'median_exon_coverage'
        tidy: 'median_exon_coverage'
        type: 'float'
        description: 'median exon coverage'
        versions: ['latest']
      - raw: 'pct_exon_1000x'
        tidy: 'pct_exon_1000x'
        type: 'float'
        description: 'percent of exon bases at >=1000x'
        versions: ['latest']
      - raw: 'gene_scaled_mad'
        tidy: 'gene_scaled_mad'
        type: 'float'
        description: 'gene-scaled median absolute deviation (CNV)'
        versions: ['latest']
      - raw: 'median_bin_count_cnv_target'
        tidy: 'median_bin_count_cnv_target'
        type: 'float'
        description: 'median bin count over CNV target'
        versions: ['latest']
      - raw: 'total_pf_reads'
        tidy: 'total_pf_reads'
        type: 'float'
        description: 'total passing-filter reads'
        versions: ['latest']
      - raw: 'mean_target_coverage'
        tidy: 'mean_target_coverage'
        type: 'float'
        description: 'mean target coverage'
        versions: ['latest']
      - raw: 'pct_contamination_est'
        tidy: 'pct_contamination_est'
        type: 'float'
        description: 'estimated percent contamination'
        versions: ['latest']
      - raw: 'max_somatic_af'
        tidy: 'max_somatic_af'
        type: 'float'
        description: 'maximum somatic allele frequency'
        versions: ['latest']
      - raw: 'tmb_per_mb'
        tidy: 'tmb_per_mb'
        type: 'float'
        description: 'tumor mutational burden per megabase'
        versions: ['latest']
      - raw: 'tmb_coding_region_size_mb'
        tidy: 'tmb_coding_region_size_mb'
        type: 'float'
        description: 'TMB coding region size (Mb)'
        versions: ['latest']
      - raw: 'tmb_somatic_coding_variants_count'
        tidy: 'tmb_somatic_coding_variants_count'
        type: 'float'
        description: 'somatic coding variants counted for TMB'
        versions: ['latest']
      - raw: 'msi_pct_unstable_sites'
        tidy: 'msi_pct_unstable_sites'
        type: 'float'
