tables:
  metricsmain:
    description: 'DRAGEN coverage summary metrics.'
    pattern: "\\.(?:wgs|tmb|exon|target_bed|qc-coverage-region-[A-Za-z0-9-]+)_coverage_metrics(?:_normal|_tumor)?\\.csv$"
    ftype: 'dragen-metrics'
    columns:
      - raw: 'Aligned bases'
        tidy: 'bases_aligned_tot'
        type: 'float'
        description: 'total aligned bases'
        versions: ['latest']
      - raw: 'Aligned reads'
        tidy: 'reads_aligned_tot'
        type: 'float'
        description: 'total aligned reads'
        versions: ['latest']
      - raw: 'Aligned bases in region'
        tidy: 'bases_aligned_in_region'
        type: 'float'
        description: 'number of uniquely mapped bases to the region'
        versions: ['latest']
      - raw: 'Aligned reads in region'
        tidy: 'reads_aligned_in_region'
        type: 'float'
        description: 'number of uniquely mapped reads to the region; only reads with MAPQ >= 1 are included, secondary and supplementary alignments ignored'
        versions: ['latest']
      - raw: 'Average alignment coverage'
        tidy: 'cov_alignment_avg'
        type: 'float'
        description: 'uniquely mapped bases to the region divided by the number of sites in the region'
        versions: ['latest']
      - raw: 'Average autosomal coverage'
        tidy: 'cov_auto_avg'
        type: 'float'
        description: 'bases aligned to autosomal loci divided by the number of autosomal loci; NA if the reference/region has no autosomes'
        versions: ['latest']
      - raw: 'Average mitochondrial coverage'
        tidy: 'cov_mt_avg'
        type: 'float'
        description: 'bases aligned to the mitochondrial chromosome divided by the number of mitochondrial loci; NA if the reference/region has no MT'
        versions: ['latest']
      - raw: 'Mean/Median autosomal coverage ratio'
        tidy: 'cov_mean_median_auto_ratio'
        type: 'float'
        description: 'mean autosomal coverage divided by median autosomal coverage'
        versions: ['latest']
      - raw: 'Median autosomal coverage'
        tidy: 'cov_auto_median'
        type: 'float'
        description: 'median alignment coverage over autosomal loci'
        versions: ['latest']
      - raw: 'Median chr X coverage (ignore 0x regions)'
        tidy: 'cov_x_median_ign0'
        type: 'float'
        description: 'median alignment coverage over chr X loci, ignoring 0x loci; NA if the reference/region has no chr X'
        versions: ['latest']
      - raw: 'Median chr Y coverage (ignore 0x regions)'
        tidy: 'cov_y_median_ign0'
        type: 'float'
        description: 'median alignment coverage over chr Y loci, ignoring 0x loci; NA if the reference/region has no chr Y'
        versions: ['latest']
      - raw: 'Uniformity of coverage (PCT > 0.2*mean)'
        tidy: 'cov_uniformity_pct_gt02mean'
        type: 'float'
        description: 'percentage of sites with coverage greater than 20% of the mean coverage in the region'
        versions: ['latest']
      - raw: 'Uniformity of coverage (PCT > 0.4*mean)'
        tidy: 'cov_uniformity_pct_gt04mean'
        type: 'float'
        description: 'percentage of sites with coverage greater than 40% of the mean coverage in the region'
        versions: ['latest']
      - raw: 'Average chr X coverage'
        tidy: 'cov_x_avg'
        type: 'float'
        description: 'average chr X coverage'
        versions: ['latest']
      - raw: 'Average chr Y coverage'
        tidy: 'cov_y_avg'
        type: 'float'
        description: 'average chr Y coverage'
        versions: ['latest']
      - raw: 'XAvgCov/YAvgCov ratio'
        tidy: 'cov_x_y_ratio'
        type: 'float'
        description: 'average chr X coverage / average chr Y coverage'
        versions: ['latest']
      - raw: 'XAvgCov/AutosomalAvgCov ratio'
        tidy: 'cov_x_auto_ratio'
        type: 'float'
        description: 'average chr X coverage / average autosomal coverage'
        versions: ['latest']
      - raw: 'YAvgCov/AutosomalAvgCov ratio'
        tidy: 'cov_y_auto_ratio'
        type: 'float'
        description: 'average chr Y coverage / average autosomal coverage'
        versions: ['latest']
  metricsbins:
    description: 'DRAGEN coverage-depth histogram: percent of region bases with coverage in each finite [cov_lo, cov_hi) bin.'
    pattern: "__no_file_match__metricsbins"
    ftype: 'dragen-metrics'
    columns:
      - raw: 'cov_pct'
        tidy: 'pct'
        type: 'float'
        description: 'percentage of sites in the region with at least cov_lo but less than cov_hi coverage'
        versions: ['latest']
  metricscumu:
    description: 'DRAGEN cumulative coverage: percent of region bases with coverage at least cov_min.'
    pattern: "__no_file_match__metricscumu"
    ftype: 'dragen-metrics'
    columns:
      - raw: 'cov_pct'
        tidy: 'pct'
        type: 'float'
        description: 'percentage of sites in the region with at least cov_min coverage'
        versions: ['latest']
  contigmean:
    description: 'DRAGEN per-contig mean coverage (chrom, aligned bases, mean coverage).'
    pattern: "\\.(?:wgs|tmb|exon|target_bed|qc-coverage-region-[A-Za-z0-9-]+)_contig_mean_cov(?:_normal|_tumor)?\\.csv$"
    ftype: 'csv-nohead'
    columns:
      - raw: 'chrom'
        tidy: 'chrom'
        type: 'char'
        description: 'contig name'
        versions: ['latest']
      - raw: 'bases'
        tidy: 'bases'
        type: 'float'
        description: 'number of bases aligned to the contig'
        versions: ['latest']
      - raw: 'coverage'
        tidy: 'cov_mean'
        type: 'float'
        description: 'estimated coverage: aligned bases (bases column) divided by the contig length'
        versions: ['latest']
  finehist:
    description: 'DRAGEN fine coverage histogram (per-depth base counts).'
    pattern: "\\.(?:wgs|tmb|exon|target_bed|qc-coverage-region-[A-Za-z0-9-]+)_fine_hist(?:_normal|_tumor)?\\.csv$"
    ftype: 'csv'
    columns:
      - raw: 'Depth'
        tidy: 'depth'
        type: 'int'
        description: 'coverage depth'
        versions: ['latest']
      - raw: 'Overall'
        tidy: 'count'
        type: 'float'
        description: 'number of loci covered at this depth'
        versions: ['latest']
  reportbedmain:
    description: 'DRAGEN coverage report BED, distribution stats per region interval.'
    pattern: "\\.(?:wgs|tmb|exon|target_bed|qc-coverage-region-[A-Za-z0-9-]+)_cov_report(?:_normal|_tumor)?\\.bed$"
    ftype: 'tsv'
    columns:
      - raw: '#chrom'
        tidy: 'chrom'
        type: 'char'
        description: 'chrom'
        versions: ['latest']
      - raw: 'start'
        tidy: 'start'
        type: 'int'
        description: 'start'
        versions: ['latest']
      - raw: 'end'
        tidy: 'end'
        type: 'int'
        description: 'end'
        versions: ['latest']
      - raw: 'total_cvg'
        tidy: 'total_cvg'
        type: 'float'
        description: 'total coverage'
        versions: ['latest']
      - raw: 'mean_cvg'
        tidy: 'mean_cvg'
        type: 'float'
        description: 'mean coverage'
        versions: ['latest']
      - raw: 'Q1_cvg'
        tidy: 'q1_cvg'
        type: 'float'
        description: 'lower quartile (25th percentile) coverage over the interval'
        versions: ['latest']
      - raw: 'median_cvg'
        tidy: 'median_cvg'
        type: 'float'
        description: 'median coverage over the interval'
        versions: ['latest']
      - raw: 'Q3_cvg'
        tidy: 'q3_cvg'
        type: 'float'
        description: 'upper quartile (75th percentile) coverage over the interval'
        versions: ['latest']
      - raw: 'min_cvg'
        tidy: 'min_cvg'
        type: 'float'
        description: 'minimum coverage over the interval'
        versions: ['latest']
      - raw: 'max_cvg'
        tidy: 'max_cvg'
        type: 'float'
        description: 'maximum coverage over the interval'
        versions: ['latest']
  reportbedcumu:
    description: 'DRAGEN coverage-report cumulative thresholds: percent of interval bases above each coverage threshold, long.'
    pattern: "__no_file_match__reportbedcumu"
    ftype: 'tsv'
    columns:
      - raw: 'chrom'
        tidy: 'chrom'
        type: 'char'
        description: 'chromosome'
        versions: ['latest']
      - raw: 'start'
        tidy: 'start'
        type: 'int'
        description: 'region interval start'
        versions: ['latest']
      - raw: 'end'
        tidy: 'end'
        type: 'int'
        description: 'region interval end'
        versions: ['latest']
      - raw: 'cov_min'
        tidy: 'cov_min'
        type: 'int'
        description: 'coverage threshold X (from the pct_above_<X> column name)'
        versions: ['latest']
      - raw: 'pct_above'
        tidy: 'pct_above'
        type: 'float'
        description: 'percentage of bases over the interval with depth coverage strictly greater than cov_min'
        versions: ['latest']
  readreportbed:
    description: 'DRAGEN per-gene read coverage report BED.'
    pattern: "\\.(?:wgs|tmb|exon|target_bed|qc-coverage-region-[A-Za-z0-9-]+)_read_cov_report(?:_normal|_tumor)?\\.bed$"
    ftype: 'tsv'
    columns:
      - raw: '#chrom'
        tidy: 'chrom'
        type: 'char'
        description: 'chrom'
        versions: ['latest']
      - raw: 'start'
        tidy: 'start'
        type: 'int'
        description: 'start'
        versions: ['latest']
      - raw: 'end'
        tidy: 'end'
        type: 'int'
        description: 'end'
        versions: ['latest']
      - raw: 'name'
        tidy: 'name'
        type: 'char'
        description: 'name'
        versions: ['latest']
      - raw: 'gene_id'
        tidy: 'gene_id'
        type: 'char'
        description: 'gene ID'
        versions: ['latest']
      - raw: 'total_cvg'
        tidy: 'total_cvg'
        type: 'float'
        description: 'total coverage'
        versions: ['latest']
      - raw: 'read1_cvg'
        tidy: 'read1_cvg'
        type: 'float'
        description: 'total Read 1 coverage value over the interval'
        versions: ['latest']
      - raw: 'read2_cvg'
        tidy: 'read2_cvg'
        type: 'float'
        description: 'total Read 2 coverage value over the interval'
        versions: ['latest']
