  fraglenhist:
    description: 'DRAGEN fragment length histogram per sample.'
    pattern: "\\.fragment_length_hist\\.csv$"
    ftype: 'csv'
    columns:
      - raw: 'sample'
        tidy: 'sample'
        type: 'char'
        description: 'DRAGEN sample id from the #Sample: block header'
        versions: ['latest']
      - raw: 'FragmentLength'
        tidy: 'fraglen'
        type: 'int'
        description: 'fragment length (bp)'
        versions: ['latest']
      - raw: 'Count'
        tidy: 'count'
        type: 'float'
        description: 'number of fragments at this length'
        versions: ['latest']
